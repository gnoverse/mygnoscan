name: e2e

on:
  push:
    branches:
      - main
  pull_request:

# A pull request wants one run per branch: a push supersedes the run before it
# and cancelling the old one is the point. A push to main wants the opposite.
# Sharing a per-ref group there meant every queued e2e was superseded by the
# next merge and cancelled before it ever started: measured 2026-09-23, both
# 5decf4c and 5b14b34 show `e2e: cancelled` beside `docker: success`. main's
# e2e is the fallback whenever a PR merges on a base that has since moved, and
# a backstop that never fires is worse than none, because it gets relied on.
# One group per commit on main, so a run is only ever cancelled by a newer run
# for the same commit, which cannot happen.
concurrency:
  group: e2e-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  browser:
    name: browser tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The screenshot step diffs against the base branch to decide whether
          # the frontend changed, which a shallow clone cannot do.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Node is a development dependency here and nowhere else: it drives the
      # browser and never touches the binary, which still embeds the frontend
      # with no build step.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: e2e

      - name: Install browser
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run
        run: npx playwright test
        working-directory: e2e

      # A capture of every page, for PRs that touch the frontend.
      #
      # The reviewer's problem this solves: a frontend diff is unreadable as
      # text, and checking the branch out to look at five pages is enough
      # friction that nobody does it. These render against the same seeded
      # fixture the suite uses, so they are identical run to run and a real
      # visual diff rather than noise.
      #
      # Only on frontend changes, and never blocking: a screenshot that differs
      # is information, not a failure. Pixel-exact diffing across browser
      # versions is a known source of false red.
      - name: Capture page screenshots
        if: github.event_name == 'pull_request'
        id: shots
        continue-on-error: true
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^pkg/web/frontend/'; then
            npm run screenshots
          else
            echo "no frontend changes; skipping"
          fi
        working-directory: e2e

      - name: Upload page screenshots
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: page-screenshots
          path: docs/images/review/
          if-no-files-found: ignore
          retention-days: 14

      # Screenshot, video and trace for anything that failed. Without these a
      # red run in CI is a mystery, which is most of why this suite exists.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts
          path: |
            e2e/test-results/
            e2e/playwright-report/
          if-no-files-found: warn
          retention-days: 7
